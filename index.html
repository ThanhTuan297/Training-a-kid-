<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELI10 - Đăng nhập / Đăng ký</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Gradient background mượt mà */
        .bg-gradient-eli {
            background: linear-gradient(135deg, #f0fdf4 0%, #e6f4ea 50%, #dcfce7 100%);
        }

        /* Animate tab transitions */
        .tab-content {
            display: none;
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
        }

        .tab-content.active {
            display: block;
            opacity: 1;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #10b981;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-gradient-eli min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 md:p-8">

    <script>
        // Inline check để tự động chuyển hướng nếu người dùng đã đăng nhập từ trước
        (function checkExistingAuth() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const isAdmin = localStorage.getItem('isAdmin') === 'true';

            if (isAdmin) {
                window.location.href = 'admin.html';
            } else if (isLoggedIn) {
                window.location.href = 'trangchu.html';
            }
        })();
    </script>

    <!-- Header Spacer -->
    <div></div>

    <main class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-emerald-900/5 border border-emerald-100/80 p-6 sm:p-8 relative overflow-hidden my-auto">
        
        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500 text-white mb-3 shadow-lg shadow-emerald-500/30 transform hover:scale-105 transition-transform duration-200">
                <i data-lucide="sprout" class="w-9 h-9"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">
                ELI<span class="text-emerald-600">10</span>
            </h1>
            <p class="text-xs sm:text-sm font-medium text-slate-500 mt-1">
                Học tập sáng tạo 
            </p>
        </div>

        <!-- Notification Toast Box -->
        <div id="alertBox" class="hidden mb-5 p-3.5 rounded-xl text-sm font-medium flex items-center gap-2.5 transition-all duration-300">
            <i id="alertIcon" class="w-5 h-5 shrink-0"></i>
            <span id="alertMessage" class="flex-1"></span>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex p-1 bg-slate-100 rounded-2xl mb-6 relative">
            <button id="tabLoginBtn" onclick="switchTab('login')" 
                class="flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-emerald-700 bg-white shadow-sm flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-4 h-4"></i>
                Đăng nhập
            </button>
            <button id="tabRegisterBtn" onclick="switchTab('register')" 
                class="flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-slate-500 hover:text-slate-800 flex items-center justify-center gap-2">
                <i data-lucide="user-plus" class="w-4 h-4"></i>
                Đăng ký
            </button>
        </div>

        <div id="loginTab" class="tab-content active">
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <!-- Username/Email -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                        Email hoặc Tên tài khoản
                    </label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="loginIdentifier" required placeholder="name@example.com"
                            class="w-full pl-11 pr-4 py-3 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all text-slate-800 text-sm">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">
                            Mật khẩu
                        </label>
                        <a href="#" onclick="showToast('Tính năng quên mật khẩu đang được phát triển!', 'info'); return false;" 
                           class="text-xs text-emerald-600 font-semibold hover:underline">Phục hồi?</a>
                    </div>
                    <div class="relative">
                        <i data-lucide="lock" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="loginPassword" required placeholder="••••••••"
                            class="w-full pl-11 pr-11 py-3 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all text-slate-800 text-sm">
                        <button type="button" onclick="togglePasswordVisibility('loginPassword', 'loginPasswordIcon')" 
                            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none">
                            <i id="loginPasswordIcon" data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Role Selection Checkbox -->
                <div class="pt-1">
                    <label class="flex items-center gap-2.5 cursor-pointer select-none group">
                        <input type="checkbox" id="adminRoleCheckbox" 
                            class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 border-slate-300 transition-colors">
                        <span class="text-xs text-slate-600 group-hover:text-slate-900 font-medium flex items-center gap-1.5">
                            <i data-lucide="shield-alert" class="w-4 h-4 text-emerald-600"></i>
                            Đăng nhập với tư cách là Vua (Admin)
                        </span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" 
                    class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/25 transition-all duration-200 flex items-center justify-center gap-2 mt-2">
                    <span>Đăng Nhập</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>

        <div id="registerTab" class="tab-content">
            <form onsubmit="handleRegister(event)" class="space-y-3.5">
                <!-- Full Name -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                        Họ và tên
                    </label>
                    <div class="relative">
                        <i data-lucide="user" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="regName" required placeholder="Nguyễn Văn A"
                            class="w-full pl-11 pr-4 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all text-slate-800 text-sm">
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                        Email
                    </label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="email" id="regEmail" required placeholder="hocvien@eli10.edu.vn"
                            class="w-full pl-11 pr-4 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all text-slate-800 text-sm">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                        Mật khẩu
                    </label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="regPassword" required placeholder="Tối thiểu 6 ký tự"
                            class="w-full pl-11 pr-11 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all text-slate-800 text-sm">
                        <button type="button" onclick="togglePasswordVisibility('regPassword', 'regPasswordIcon')" 
                            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none">
                            <i id="regPasswordIcon" data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                        Xác nhận mật khẩu
                    </label>
                    <div class="relative">
                        <i data-lucide="check-circle-2" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="regConfirmPassword" required placeholder="Nhập lại mật khẩu"
                            class="w-full pl-11 pr-4 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all text-slate-800 text-sm">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" 
                    class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/25 transition-all duration-200 flex items-center justify-center gap-2 mt-4">
                    <span>Tạo Tài Khoản</span>
                    <i data-lucide="user-check" class="w-4 h-4"></i>
                </button>
            </form>
        </div>

        <!-- Footer note -->
        <div class="mt-6 pt-4 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-400">
                Bằng cách đăng nhập, bạn đồng ý với <a href="#" class="underline hover:text-slate-600">Điều khoản</a> & <a href="#" class="underline hover:text-slate-600">Bảo mật</a> của ELI10.
            </p>
        </div>
    </main>

    <footer class="w-full max-w-md mt-6 text-center">
        <!-- 
          =======================================================================
          // TODO: Xóa nút này khi đưa vào vận hành chính thức (Production Environment)
          =======================================================================
        -->
        <button onclick="handleDevBypass()" 
            title="Sử dụng cho mục đích kiểm thử nhanh giao diện"
            class="inline-flex items-center gap-2 px-3.5 py-2 bg-slate-200/80 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded-lg border border-slate-300 transition-all duration-200 shadow-sm">
            <span>🚀 Truy cập nhanh (Bypass &rarr; trangchu.html) [Dev Only]</span>
        </button>
    </footer>

    <script>
        // Khởi tạo icons Lucide
        lucide.createIcons();

        // Switch giữa 2 Tab: Login / Register
        function switchTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');

            // Ẩn thông báo lỗi/thành công cũ nếu có
            hideToast();

            if (tab === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');

                tabLoginBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-emerald-700 bg-white shadow-sm flex items-center justify-center gap-2";
                tabRegisterBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-slate-500 hover:text-slate-800 flex items-center justify-center gap-2";
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');

                tabRegisterBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-emerald-700 bg-white shadow-sm flex items-center justify-center gap-2";
                tabLoginBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-slate-500 hover:text-slate-800 flex items-center justify-center gap-2";
            }
        }

        // Toggle Ẩn / Hiện Password
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // Hiển thị thông báo Toast
        function showToast(message, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            const alertIcon = document.getElementById('alertIcon');
            const alertMessage = document.getElementById('alertMessage');

            alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border', 'border-red-200', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200', 'bg-blue-50', 'text-blue-700', 'border-blue-200');

            if (type === 'error') {
                alertBox.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
                alertIcon.setAttribute('data-lucide', 'alert-circle');
            } else if (type === 'success') {
                alertBox.classList.add('bg-emerald-50', 'text-emerald-700', 'border', 'border-emerald-200');
                alertIcon.setAttribute('data-lucide', 'check-circle');
            } else {
                alertBox.classList.add('bg-blue-50', 'text-blue-700', 'border', 'border-blue-200');
                alertIcon.setAttribute('data-lucide', 'info');
            }

            alertMessage.textContent = message;
            lucide.createIcons();
            alertBox.classList.remove('hidden');
        }

        // Ẩn thông báo
        function hideToast() {
            document.getElementById('alertBox').classList.add('hidden');
        }

        // Utility Validate Email
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function handleLogin(event) {
            event.preventDefault();

            const identifier = document.getElementById('loginIdentifier').value.trim();
            const password = document.getElementById('loginPassword').value;
            const isAdminSelected = document.getElementById('adminRoleCheckbox').checked;

            // Basic Validation
            if (!identifier) {
                showToast('Vui lòng nhập Email hoặc Tên tài khoản!');
                return;
            }

            if (!password) {
                showToast('Vui lòng nhập mật khẩu!');
                return;
            }

            if (password.length < 4) {
                showToast('Mật khẩu phải chứa ít nhất 4 ký tự!');
                return;
            }

            // Xử lý Phân quyền Đăng Nhập
            if (isAdminSelected) {
                // Đăng nhập quyền Admin
                localStorage.setItem('isAdmin', 'true');
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userEmail', identifier);
                showToast('Đăng nhập Quản trị viên thành công! Đang chuyển hướng...', 'success');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 800);
            } else {
                // Đăng nhập Người dùng thường
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('isAdmin', 'false');
                localStorage.setItem('userEmail', identifier);
                showToast('Đăng nhập thành công! Đang chuyển hướng...', 'success');
                setTimeout(() => {
                    window.location.href = 'trangchu.html';
                }, 800);
            }
        }

        function handleRegister(event) {
            event.preventDefault();

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            // Basic Validation
            if (!name) {
                showToast('Vui lòng nhập Họ và tên!');
                return;
            }

            if (!isValidEmail(email)) {
                showToast('Định dạng Email không hợp lệ!');
                return;
            }

            if (password.length < 6) {
                showToast('Mật khẩu đăng ký phải từ 6 ký tự trở lên!');
                return;
            }

            if (password !== confirmPassword) {
                showToast('Mật khẩu xác nhận không trùng khớp!');
                return;
            }

            // Đăng ký thành công -> Thông báo và chuyển tab
            showToast('Tạo tài khoản thành công! Bạn có thể đăng nhập ngay.', 'success');
            
            // Auto fill email sang form đăng nhập
            document.getElementById('loginIdentifier').value = email;

            // Chuyển sang Tab Đăng Nhập sau 1.2s
            setTimeout(() => {
                switchTab('login');
            }, 1200);
        }

        // TODO: Xóa nút này khi đưa vào vận hành chính thức
        function handleDevBypass() {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('isAdmin', 'false');
            localStorage.setItem('userEmail', 'dev_bypass@eli10.edu.vn');
            
            showToast('🚀 Dev Bypass: Đã lưu phiên giả lập! Đang tới trangchu.html...', 'info');
            setTimeout(() => {
                window.location.href = 'trangchu.html';
            }, 500);
        }
    </script>
</body>
</html>

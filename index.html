<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedagogy Practice Portal - Login</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Chuyển động mượt mà cho tay và mắt của Tim */
    .tim-hand, .tim-eye, .tim-pupil {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-sky-50 to-pink-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

  <div class="w-full max-w-md relative">
    
    <!-- Dynamic Speech Bubble -->
    <div class="flex justify-center mb-2">
      <div class="relative bg-white/90 backdrop-blur-md px-4 py-2 rounded-2xl shadow-sm border border-indigo-100 text-xs font-semibold text-indigo-700 flex items-center gap-1.5 transition-all duration-300">
        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-500"></i>
        <span id="speechText">Hi Teacher! Ready for today's lesson?</span>
        <!-- Speech Bubble Arrow -->
        <div class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-3 h-3 bg-white border-r border-b border-indigo-100 rotate-45"></div>
      </div>
    </div>

    <!-- Mascot (Tim - 10yo AI Student) Area -->
    <div class="flex justify-center -mb-8 relative z-20 pointer-events-none">
      <svg class="w-40 h-40 filter drop-shadow-lg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Body / Hoodie -->
        <path d="M50 165 C50 135, 150 135, 150 165 L160 200 L40 200 Z" fill="#4F46E5" />
        <path d="M85 140 L115 140 L108 175 L92 175 Z" fill="#EEF2FF" />
        <circle cx="100" cy="148" r="3" fill="#EF4444" />
        
        <!-- Head -->
        <circle cx="100" cy="95" r="48" fill="#FFDFC4" />

        <!-- Hair -->
        <path d="M52 90 C50 60, 70 42, 100 42 C130 42, 150 60, 148 90 C140 68, 125 60, 100 65 C75 60, 60 68, 52 90 Z" fill="#371B0D" />
        <path d="M95 43 C98 33, 108 33, 105 43 Z" fill="#371B0D" />

        <!-- Ears -->
        <circle cx="50" cy="98" r="10" fill="#FFDFC4" />
        <circle cx="150" cy="98" r="10" fill="#FFDFC4" />

        <!-- Glasses -->
        <rect x="62" y="80" width="32" height="24" rx="6" fill="none" stroke="#1E293B" stroke-width="3.5" />
        <rect x="106" y="80" width="32" height="24" rx="6" fill="none" stroke="#1E293B" stroke-width="3.5" />
        <line x1="94" y1="90" x2="106" y2="90" stroke="#1E293B" stroke-width="3.5" />

        <!-- Eyes -->
        <g id="eyesGroup">
          <circle cx="78" cy="92" r="6" fill="white" />
          <circle id="pupilLeft" class="tim-pupil" cx="78" cy="92" r="3" fill="#0F172A" />

          <circle cx="122" cy="92" r="6" fill="white" />
          <circle id="pupilRight" class="tim-pupil" cx="122" cy="92" r="3" fill="#0F172A" />
        </g>

        <!-- Cheeks -->
        <ellipse cx="66" cy="105" rx="6" ry="4" fill="#F87171" opacity="0.4" />
        <ellipse cx="134" cy="105" rx="6" ry="4" fill="#F87171" opacity="0.4" />

        <!-- Mouth -->
        <path id="mouth" d="M90 112 Q100 122 110 112" fill="none" stroke="#9A3412" stroke-width="3" stroke-linecap="round" />

        <!-- Hands (Covering Eyes Effect) -->
        <g id="handsGroup" class="tim-hand" style="transform: translateY(45px); opacity: 0;">
          <!-- Left Hand -->
          <path d="M52 112 C52 82, 85 82, 88 100 C88 112, 60 122, 52 112 Z" fill="#FFDFC4" stroke="#E2E8F0" stroke-width="1" />
          <circle cx="68" cy="90" r="3.5" fill="#FCA5A5" />
          <circle cx="76" cy="88" r="3.5" fill="#FCA5A5" />
          <!-- Right Hand -->
          <path d="M148 112 C148 82, 115 82, 112 100 C112 112, 140 122, 148 112 Z" fill="#FFDFC4" stroke="#E2E8F0" stroke-width="1" />
          <circle cx="132" cy="90" r="3.5" fill="#FCA5A5" />
          <circle cx="124" cy="88" r="3.5" fill="#FCA5A5" />
        </g>
      </svg>
    </div>

    <!-- Login Form Card -->
    <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-8 shadow-xl border border-white/60 relative z-10 pt-12">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Teacher Portal</h1>
        <p class="text-sm text-slate-500 mt-1">Sign in to start practicing with AI students</p>
      </div>

      <form id="loginForm" class="space-y-4" onsubmit="event.preventDefault(); alert('Login Successful!');">
        <!-- Username / Email -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Email or Username</label>
          <div class="relative">
            <i data-lucide="mail" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input 
              type="text" 
              id="usernameInput"
              placeholder="teacher@pedagogy.edu.vn"
              class="w-full pl-11 pr-4 py-3 bg-slate-50/80 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm outline-none"
            />
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input 
              type="password" 
              id="passwordInput"
              placeholder="••••••••"
              class="w-full pl-11 pr-11 py-3 bg-slate-50/80 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm outline-none"
            />
            <button 
              type="button" 
              id="togglePasswordBtn"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors p-1"
            >
              <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between text-xs pt-1">
          <label class="flex items-center gap-2 cursor-pointer text-slate-600">
            <input type="checkbox" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4" />
            <span>Remember me</span>
          </label>
          <a href="#" class="font-medium text-indigo-600 hover:text-indigo-700 hover:underline">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/25 transition-all transform active:scale-[0.99] flex items-center justify-center gap-2 mt-2"
        >
          <span>Sign In as Student Teacher</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- Footer Divider & Admin Link -->
      <div class="mt-8 pt-6 border-t border-slate-100 flex flex-col items-center gap-3">
        <a href="#" class="text-xs text-slate-500 hover:text-indigo-600 font-medium transition-colors flex items-center gap-1.5">
          <i data-lucide="shield-check" class="w-4 h-4 text-slate-400"></i>
          <span>Login as Administrator</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    // Khởi tạo icons
    lucide.createIcons();

    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');
    
    const speechText = document.getElementById('speechText');
    const pupilLeft = document.getElementById('pupilLeft');
    const pupilRight = document.getElementById('pupilRight');
    const handsGroup = document.getElementById('handsGroup');

    let showPassword = false;

    // Hàm cập nhật trạng thái hoạt ảnh của Bé Tim
    function updateTimState() {
      const isPassFocused = document.activeElement === passwordInput;
      const isEmailFocused = document.activeElement === usernameInput;
      const hasPassword = passwordInput.value.length > 0;

      if ((isPassFocused || hasPassword) && !showPassword) {
        // Trạng thái: Có mật khẩu (hoặc đang nhập) & bị che -> Tim CHE MẮT
        handsGroup.style.transform = 'translateY(0px)';
        handsGroup.style.opacity = '1';
        pupilLeft.style.transform = 'translate(0px, 0px)';
        pupilRight.style.transform = 'translate(0px, 0px)';
        speechText.innerText = "I'm not looking! It's a secret!";
      } else if ((isPassFocused || hasPassword) && showPassword) {
        // Trạng thái: Bấm xem mật khẩu -> Tim HẠ TAY & LIẾC XUỐNG
        handsGroup.style.transform = 'translateY(18px)';
        handsGroup.style.opacity = '0.7';
        pupilLeft.style.transform = 'translate(0px, 3px)';
        pupilRight.style.transform = 'translate(0px, 3px)';
        speechText.innerText = "Ooh, let me see your password! 🫣";
      } else if (isEmailFocused) {
        // Trạng thái: Nhập Email -> Tim nhìn xuống ô Email
        handsGroup.style.transform = 'translateY(45px)';
        handsGroup.style.opacity = '0';
        pupilLeft.style.transform = 'translate(0px, 2px)';
        pupilRight.style.transform = 'translate(0px, 2px)';
        speechText.innerText = "What is your teacher email?";
      } else {
        // Trạng thái Bình thường
        handsGroup.style.transform = 'translateY(45px)';
        handsGroup.style.opacity = '0';
        pupilLeft.style.transform = 'translate(0px, 0px)';
        pupilRight.style.transform = 'translate(0px, 0px)';
        speechText.innerText = "Hi Teacher! Ready for today's lesson?";
      }
    }

    // Sự kiện toggle ẩn/hiện mật khẩu
    togglePasswordBtn.addEventListener('click', () => {
      showPassword = !showPassword;
      passwordInput.type = showPassword ? 'text' : 'password';
      
      // Thay đổi icon con mắt
      eyeIcon.setAttribute('data-lucide', showPassword ? 'eye-off' : 'eye');
      lucide.createIcons();
      
      updateTimState();
    });

    // Lắng nghe các sự kiện gõ phím & focus
    passwordInput.addEventListener('focus', updateTimState);
    passwordInput.addEventListener('blur', updateTimState);
    passwordInput.addEventListener('input', updateTimState);

    usernameInput.addEventListener('focus', updateTimState);
    usernameInput.addEventListener('blur', updateTimState);
  </script>
</body>
</html>

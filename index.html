<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAI - Nền tảng Thực hành Sư phạm</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-red: #D32F2F;
            --hover-red: #B71C1C;
            --light-red: #FFEBEE;
            --white: #FFFFFF;
            --gray-light: #F8F9FA;
            --gray-border: #E0E0E0;
            --text-main: #212121;
            --text-muted: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--gray-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: var(--white);
            width: 100%;
            max-width: 960px;
            min-height: 580px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(211, 47, 47, 0.08);
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(211, 47, 47, 0.1);
        }

        /* Bên trái: Banner giới thiệu */
        .auth-banner {
            flex: 1;
            background: linear-gradient(135deg, var(--primary-red) 0%, #9A0007 100%);
            color: var(--white);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 700;
        }

        .banner-content h2 {
            font-size: 28px;
            line-height: 1.3;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .banner-content p {
            font-size: 15px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .banner-footer {
            font-size: 13px;
            opacity: 0.7;
        }

        /* Bên phải: Form Đăng nhập / Đăng ký */
        .auth-form-container {
            flex: 1.1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Tab chuyển đổi */
        .auth-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--gray-border);
        }

        .tab-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
            padding-bottom: 10px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--primary-red);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--primary-red);
        }

        /* Form styling */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-red);
            box-shadow: 0 0 0 3px var(--light-red);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .forgot-pass {
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 500;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-red);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: var(--hover-red);
        }

        /* Form Toggle Display */
        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .auth-container {
                flex-direction: column;
            }
            .auth-banner {
                padding: 30px;
            }
            .auth-form-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Banner bên trái -->
        <div class="auth-banner">
            <div class="brand">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>EduAI Pedagogical</span>
            </div>
            
            <div class="banner-content">
                <h2>Luyện Kỹ Năng Giảng Dạy Cùng AI Học Sinh</h2>
                <p>Môi trường giả lập phòng học 1-1 giúp sinh viên  thực hành giảng dạy, xử lý tình huống và rèn luyện phản xạ sư phạm hiệu quả.</p>
            </div>

            <div class="banner-footer">
                &copy; 2026 EduAI Project - xuất bản bởi TTuan
            </div>
        </div>

        <!-- Khung Form bên phải -->
        <div class="auth-form-container">
            <!-- Tab Chuyển Đổi Đăng Nhập / Đăng Ký -->
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Đăng Nhập</button>
                <button class="tab-btn" onclick="switchTab('register')">Đăng Ký</button>
            </div>

            <!-- 1. FORM ĐĂNG NHẬP -->
            <form id="login-form" class="auth-form active" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label>Email sinh viên / Mã số SV</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="text" placeholder="student@phet.edu.vn" value="sinhvien@sutam.edu.vn" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" placeholder="••••••••" value="123456" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" checked> Ghi nhớ đăng nhập
                    </label>
                    <a href="#" class="forgot-pass">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn-submit">
                    Đăng Nhập Thực Hành <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <!-- 2. FORM ĐĂNG KÝ -->
            <form id="register-form" class="auth-form" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label>Họ và Tên</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" placeholder="Nguyễn Văn A" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email trường (.edu.vn)</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" placeholder="sv@hcmue.edu.vn" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" placeholder="Tạo mật khẩu" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit" style="margin-top: 10px;">
                    Tạo Tài Khoản <i class="fa-solid fa-user-plus"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- JavaScript xử lý giao diện tạm thời -->
    <script>
        // Chuyển qua lại giữa tab Đăng nhập và Đăng ký
        function switchTab(tabName) {
            const tabs = document.querySelectorAll('.tab-btn');
            const forms = document.querySelectorAll('.auth-form');

            tabs.forEach(tab => tab.classList.remove('active'));
            forms.forEach(form => form.classList.remove('active'));

            if (tabName === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }

        // Xử lý khi nhấn nút Submit: Chuyển thẳng sang trangchu.html
        function handleAuth(event) {
            event.preventDefault(); // Chặn load lại trang
            // Chuyển hướng trực tiếp sang trang chủ
            window.location.href = 'trangchu.html';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELI10 - Phòng Học 1-1</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
            }
          }
        }
      }
    }
  </script>
  <!-- Auth Guard Script -->
  <script>
    if (localStorage.getItem('isLoggedIn') !== 'true') {
      window.location.href = 'index.html';
    }
  </script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-800">

  <!-- 1. STICKY HEADER -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <a href="trangchu.html" class="flex items-center space-x-2">
            <span class="text-2xl font-black bg-gradient-to-r from-brand-600 to-emerald-500 bg-clip-text text-transparent tracking-tight">ELI10</span>
          </a>
        </div>

        <nav class="hidden md:flex items-center space-x-1 font-medium text-slate-600">
          <a href="trangchu.html" class="px-3 py-2 rounded-lg hover:text-brand-600 hover:bg-brand-50 transition">Trang chủ</a>
          <a href="lophoc.html" class="px-3 py-2 rounded-lg text-brand-600 bg-brand-50 font-semibold">Lớp học</a>
          <a href="hocsinh.html" class="px-3 py-2 rounded-lg hover:text-brand-600 hover:bg-brand-50 transition">Học sinh</a>
          <a href="giaoan.html" class="px-3 py-2 rounded-lg hover:text-brand-600 hover:bg-brand-50 transition">Giáo án</a>
        </nav>

        <div>
          <button id="logoutBtn" onclick="handleLogout()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition border border-slate-200 hover:border-rose-200">
            Đăng xuất
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 flex flex-col max-w-5xl w-full mx-auto p-4 sm:p-6 lg:p-8">

    <!-- 2. EMPTY STATE -->
    <div id="emptyState" class="hidden my-auto flex-col items-center justify-center text-center p-8 bg-white rounded-2xl shadow-sm border border-slate-200 max-w-lg mx-auto">
      <div class="text-7xl mb-4 animate-bounce">🏫👻</div>
      <h2 class="text-2xl font-bold text-slate-900 mb-2">Chưa có ai ở đây cả!</h2>
      <p class="text-slate-600 mb-6">Bạn chưa chọn học sinh hoặc chưa nhập chủ đề bài học.</p>
      <a href="hocsinh.html" class="inline-flex items-center justify-center px-6 py-3 font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-xl shadow-lg shadow-brand-500/20 transition duration-200">
        👉 Đến trang chọn học sinh ngay
      </a>
    </div>

    <!-- 3. CLASSROOM UI -->
    <div id="classroomUI" class="hidden flex-1 flex-col h-[calc(100vh-8rem)] bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      
      <!-- Class Header -->
      <div class="px-6 py-4 bg-slate-900 text-white flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-brand-500/20 text-brand-400 flex items-center justify-center text-xl font-bold border border-brand-500/30">
            🎓
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <h1 id="studentName" class="font-bold text-lg text-white">---</h1>
              <span id="studentTypeBadge" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">---</span>
            </div>
            <p id="lessonTopic" class="text-xs text-slate-400 truncate max-w-xs sm:max-w-md">Chủ đề: ---</p>
          </div>
        </div>
        <a href="hocsinh.html" class="text-xs font-medium px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
          Đổi học sinh khác
        </a>
      </div>

      <!-- Chat History Area -->
      <div id="chatHistory" class="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4 bg-slate-50/50"></div>

      <!-- Thinking Indicator -->
      <div id="thinkingIndicator" class="hidden px-6 py-2 bg-brand-50 text-brand-700 text-xs font-medium border-t border-brand-100 flex items-center space-x-2">
        <svg class="animate-spin h-3.5 w-3.5 text-brand-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Bé đang suy nghĩ... 💭</span>
      </div>

      <!-- Input Area -->
      <div class="p-4 bg-white border-t border-slate-200">
        <form id="chatForm" onsubmit="handleSendMessage(event)" class="flex gap-2">
          <textarea 
            id="userInput" 
            rows="2" 
            placeholder="Nhập nội dung bài giảng hoặc lời thoại của Thầy/Cô..." 
            class="flex-1 p-3 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white resize-none transition"
            onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); handleSendMessage(event); }"
          ></textarea>
          <button 
            type="submit" 
            id="sendBtn" 
            class="px-5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-md shadow-brand-500/20 transition flex items-center justify-center self-end h-full min-h-[50px] disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <span>Gửi bài</span>
          </button>
        </form>
      </div>

    </div>

  </main>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    function handleLogout() {
      localStorage.removeItem('isLoggedIn');
      window.location.href = 'index.html';
    }

    const studentName = localStorage.getItem('selected_student_name');
    const studentType = localStorage.getItem('selected_student_type');
    const lessonTopic = localStorage.getItem('selected_lesson_topic');

    const emptyState = document.getElementById('emptyState');
    const classroomUI = document.getElementById('classroomUI');

    // Mảng lưu trữ lịch sử ngữ cảnh chát sạch cho mỗi phiên mới
    let chatHistoryArray = [];

    if (!studentName || !studentType || !lessonTopic) {
      emptyState.classList.remove('hidden');
      emptyState.classList.add('flex');
    } else {
      classroomUI.classList.remove('hidden');
      classroomUI.classList.add('flex');

      document.getElementById('studentName').innerText = studentName;
      document.getElementById('lessonTopic').innerText = `Chủ đề: ${lessonTopic}`;
      
      const badge = document.getElementById('studentTypeBadge');
      if (studentType === 'ngo-ngac') badge.innerText = 'Dễ • Ngơ ngác';
      else if (studentType === 'thong-minh') badge.innerText = 'Thử thách • Lơ đễnh';
      else if (studentType === 'nghich-ngom') badge.innerText = 'Hard Mode 🔥 • Nghịch ngợm';
      else badge.innerText = studentType;

      // 1. TỰ ĐỘNG XÓA SẠCH LỊCH SỬ CHÁT VÀ GIAO DIỆN KHI VÀO PHÒNG MỚI
      resetChatSession();
    }

    function resetChatSession() {
      chatHistoryArray = []; // Xóa sạch bộ nhớ tạm ngữ cảnh
      document.getElementById('chatHistory').innerHTML = ''; // Xóa sạch UI hiển thị cũ
      initClassroom(); // Khởi tạo phiên học sạch mới
    }

    function getSystemPrompt() {
      const globalRules = `QUY TẮC CHUNG CHO CẢ 3 HỌC SINH:
1. ĐÚNG ĐỘ TUỔI 10 TUỔI: Tuyệt đối KHÔNG ĐƯỢC hiểu ngay bài giảng trong 1-3 câu đầu tiên. Cần thời gian, cần ví dụ đơn giản và phản ứng tự nhiên của trẻ con.
2. TỰ ĐỘNG CHUYỂN NGÔN NGỮ: Nếu chủ đề bài học ("${lessonTopic}") có chứa từ "Tiếng Anh", "English" hoặc người dùng nói bằng tiếng Anh, AI BẮT BUỘC phải phản hồi bằng Tiếng Anh trẻ em 10 tuổi. Các môn khác dùng Tiếng Việt.`;

      let personalityPrompt = "";
      if (studentType === 'ngo-ngac') {
        personalityPrompt = `Bạn là Huy, học sinh 10 tuổi. Tính cách: Ngoan ngoãn, lễ phép, vâng lời nhưng ĐẦU ÓC CỰC KỲ NGƠ NGÁC, tiếp thu chậm. Luôn dạ/thưa. Khi nghe 1-3 câu đầu, Huy chỉ gật đầu 'Dạ vâng' nhưng bị hỏi lại thì lộ ngay là chưa hiểu gì và hỏi lại từ khó. Cần người dạy giải thích rất sâu và lấy ví dụ đơn giản ít nhất 2-3 lần mới hiểu ra.`;
      } else if (studentType === 'thong-minh') {
        personalityPrompt = `Bạn là Sarah, học sinh 10 tuổi. Tính cách: Thông minh nhưng KHÔNG HỢP TÁC, lơ đễnh, thích vẽ tranh/ngó ra cửa sổ. Khi người dạy nói một đoạn dài, Sarah sẽ thản nhiên hỏi: 'Ơ... thầy/cô vừa nói gì cơ? Em mải nhìn ra ngoài cửa sổ nên không nghe rõ, thầy/cô nói lại từ đầu đi!'.`;
      } else if (studentType === 'nghich-ngom') {
        personalityPrompt = `Bạn là Alex, học sinh 10 tuổi đại diện cho Chế độ Hard Mode. Tính cách: Vừa NGƠ NGÁC vừa NGHỊCH NGỢM, cực kỳ tiêu cực, hay cãi bướng, đòi đi chơi game Roblox/Minecraft. Alex chê bài giảng chán, đòi đi vệ sinh, đòi nghỉ học nếu người dạy giảng lý thuyết suông.`;
      } else {
        personalityPrompt = `Bạn là một học sinh 10 tuổi tên là ${studentName}. Môn học hiện tại là ${lessonTopic}.`;
      }

      return `${globalRules}\n\nTHÔNG TIN HỌC SINH:\n${personalityPrompt}`;
    }

    // HÀM GỌI GEMINI API SỬ DỤNG GEMINI-3.8-FLASH CÙNG TỐI ƯU SPEED OPTIMIZATION
    async function callGeminiAPI(systemPrompt, userMessage) {
      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        alert("Chưa có API Key! Vui lòng cấu hình ở trang Học sinh.");
        throw new Error("Chưa có API Key");
      }

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [
            {
              role: 'user',
              parts: [{ text: `System Instruction: ${systemPrompt}\n\nUser Message: ${userMessage}` }]
            }
          ],
          // 2. TỐI ƯU TỐC ĐỘ PHẢN HỒI (GIỚI HẠN maxOutputTokens)
          generationConfig: {
            maxOutputTokens: 200
          }
        })
      });

      const data = await response.json();
      
      if (!response.ok) {
        throw new Error(data.error?.message || 'Lỗi không xác định từ Google API');
      }

      return data.candidates[0].content.parts[0].text;
    }

    function appendMessage(sender, text, isError = false) {
      const chatHistory = document.getElementById('chatHistory');
      const isTeacher = sender === 'teacher';

      // Lưu trữ vào mảng lịch sử bộ nhớ tạm
      chatHistoryArray.push({ sender, text });

      const wrapper = document.createElement('div');
      wrapper.className = `flex ${isTeacher ? 'justify-end' : 'justify-start'}`;

      const messageBox = document.createElement('div');
      messageBox.className = `max-w-[80%] rounded-2xl px-4 py-3 text-sm shadow-sm ${
        isTeacher 
          ? 'bg-brand-600 text-white rounded-br-none' 
          : isError 
            ? 'bg-rose-50 text-rose-700 border border-rose-200 rounded-bl-none' 
            : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none'
      }`;

      const senderTitle = document.createElement('div');
      senderTitle.className = `text-[10px] font-bold mb-1 opacity-75 ${isTeacher ? 'text-brand-100' : isError ? 'text-rose-500' : 'text-slate-400'}`;
      senderTitle.innerText = isTeacher ? 'Thầy / Cô' : (isError ? 'Lỗi Hệ Thống' : studentName);

      const content = document.createElement('div');
      content.className = 'whitespace-pre-wrap leading-relaxed';
      content.innerText = text;

      messageBox.appendChild(senderTitle);
      messageBox.appendChild(content);
      wrapper.appendChild(messageBox);
      chatHistory.appendChild(wrapper);

      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function setLoading(isLoading) {
      const thinkingIndicator = document.getElementById('thinkingIndicator');
      const sendBtn = document.getElementById('sendBtn');
      const userInput = document.getElementById('userInput');

      if (isLoading) {
        thinkingIndicator.classList.remove('hidden');
        sendBtn.disabled = true;
        userInput.disabled = true;
      } else {
        thinkingIndicator.classList.add('hidden');
        sendBtn.disabled = false;
        userInput.disabled = false;
        userInput.focus();
      }
    }

    async function initClassroom() {
      setLoading(true);
      try {
        const systemPrompt = getSystemPrompt();
        const initInstruction = `[HỆ THỐNG]: Bạn hãy gửi lời chào đầu tiên tới thầy/cô giáo. Hãy chào đúng tính cách của bạn và nhắc tới chủ đề bài học hôm nay là "${lessonTopic}". Ngắn gọn 1-2 câu.`;
        
        const reply = await callGeminiAPI(systemPrompt, initInstruction);
        appendMessage('student', reply);
      } catch (err) {
        appendMessage('student', `Lỗi API: Không thể kết nối với Gemini (${err.message}). Vui lòng kiểm tra lại API Key ở trang Học sinh!`, true);
      } finally {
        setLoading(false);
      }
    }

    async function handleSendMessage(e) {
      if (e) e.preventDefault();

      const userInput = document.getElementById('userInput');
      const text = userInput.value.trim();

      if (!text) return;
      userInput.value = '';

      appendMessage('teacher', text);

      setLoading(true);
      try {
        const systemPrompt = getSystemPrompt();
        const reply = await callGeminiAPI(systemPrompt, text);
        appendMessage('student', reply);
      } catch (err) {
        appendMessage('student', `Lỗi API: Không thể kết nối với Gemini (${err.message}). Vui lòng kiểm tra lại API Key ở trang Học sinh!`, true);
      } finally {
        setLoading(false);
      }
    }
  </script>
</body>
</html>
